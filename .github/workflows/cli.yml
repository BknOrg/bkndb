name: CLI validation candidates
on:
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'scripts/cli/**', 'fuzz/**', '.github/workflows/cli.yml']
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      soak:
        description: 'Run eight-hour CLI soak on a provisioned self-hosted bkndb-soak runner'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        if: runner.os != 'Linux'
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - uses: msys2/setup-msys2@v2
        id: msys
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: '"$env:MSYS2_ROOT\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Linux glibc 2.28 candidate
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/work" -w /work '${{ matrix.image }}' bash -euo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
            export PATH="$HOME/.cargo/bin:$PATH"
            /opt/python/cp311-cp311/bin/python scripts/cli/candidate.py prepare --target "${{ matrix.target }}" --output "dist/cli/${{ matrix.target }}"
          '
      - name: macOS or Windows candidate
        if: runner.os != 'Linux'
        run: python scripts/cli/candidate.py prepare --target '${{ matrix.target }}' --output 'dist/cli/${{ matrix.target }}'
      - name: Tooling regression tests
        run: python -m unittest discover -s scripts/cli -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/cli/${{ matrix.target }}/
          if-no-files-found: error
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-16
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fuzz run cli_inputs -- -max_total_time=60 -timeout=5 -max_len=65536 -rss_limit_mb=1024
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-fuzz-corpus
          path: |
            fuzz/corpus/cli_inputs
            fuzz/artifacts/cli_inputs
  soak:
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: [self-hosted, bkndb-soak]
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - run: cargo build --release --locked -p bkndb-cli
      - run: python3 scripts/cli/candidate.py soak --binary target/release/bkndb --output cli-soak --hours 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-soak
          path: cli-soak/
