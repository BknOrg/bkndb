name: Go static bindings

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bindings/bkndb.h'
      - 'bindings/go/**'
      - 'scripts/go/**'
      - '.github/workflows/go*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A source fix supersedes an older PR build. Manual preparation is never canceled.
concurrency:
  group: go-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CGO_ENABLED: '1'
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  test:
    name: Static Go (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
          - platform: darwin_amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: darwin_arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows_amd64
            runner: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Install Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - name: Install MinGW compiler and import inspector
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
      - name: Select MinGW
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: '"$env:MSYS2_ROOT\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Remove previously packaged archives
        run: python -c 'import shutil; shutil.rmtree("bindings/go/bkndb/lib", ignore_errors=True)'
      - name: Build Linux archive with glibc 2.28
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/work" -w /work '${{ matrix.image }}' bash -euo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
            export PATH="$HOME/.cargo/bin:$PATH"
            /opt/python/cp311-cp311/bin/python scripts/go/package.py build "${{ matrix.platform }}"
          '
      - name: Build macOS or Windows archive
        if: runner.os != 'Linux'
        run: python scripts/go/package.py build '${{ matrix.platform }}'
      - name: Packaging regression tests
        run: python -m unittest discover -s scripts/go -p 'test_*.py'
      - name: Verify header and archive
        run: python scripts/go/package.py verify
      - name: Test bindings
        working-directory: bindings/go/bkndb
        run: go test -v ./...
      - name: Test isolated module consumer and executable imports
        run: python scripts/go/package.py consumer
      - name: Check disabled CGO and unsupported-platform diagnostics
        run: python scripts/go/check_diagnostics.py
      - uses: actions/upload-artifact@v4
        with:
          name: go-static-${{ matrix.platform }}
          path: bindings/go/bkndb/lib/${{ matrix.platform }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 30


  distribution-check:
    name: Validate complete Go distribution
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: go-static-*
          path: /tmp/go-static
      - name: Assemble and validate the five-target package
        shell: bash
        run: |
          rm -rf bindings/go/bkndb/lib
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64; do
            mkdir -p "bindings/go/bkndb/lib/$platform"
            cp /tmp/go-static/go-static-"$platform"/* "bindings/go/bkndb/lib/$platform/"
          done
          python scripts/go/package.py assemble
          python scripts/go/package.py zip --all
          python scripts/go/package.py consumer
          bash scripts/publish/check_versions.sh
      - uses: actions/upload-artifact@v4
        with:
          name: go-distribution
          path: bindings/go/bkndb/lib/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
