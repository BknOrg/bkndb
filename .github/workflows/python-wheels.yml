name: Python wheels

on:
  push:
    tags: ["python-v*"]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "bindings/python/**"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch: {}

jobs:
  # Builds from source (maturin compiles the Rust crate) and runs the test
  # suite on every supported Python. The wheel itself is Python-version
  # agnostic (py3-none-<platform>), but the Python wrapper code isn't.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install bkndb (built from source) with test extras
        run: python -m pip install "./bindings/python[test,pandas,networkx]"
      - name: Run tests against the installed package
        working-directory: bindings/python
        # --import-mode=importlib + running from a copy of the tests keeps
        # pytest from importing the uninstalled source tree instead.
        shell: bash
        run: |
          cp -r tests "$RUNNER_TEMP/bkndb-tests"
          cd "$RUNNER_TEMP"
          python -m pytest -q --import-mode=importlib bkndb-tests

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64 }
          - { os: macos-14, target: x86_64 }
          - { os: macos-14, target: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  smoke:
    # Installs each native wheel into a clean environment on a matching runner.
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: wheel-ubuntu-latest-x86_64 }
          - { os: windows-latest, artifact: wheel-windows-latest-x64 }
          - { os: macos-14, artifact: wheel-macos-14-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - shell: bash
        run: |
          python -m pip install dist/*.whl
          python -c "import bkndb; db = bkndb.in_memory(); n = db.create_node('Smoke', {}); assert db.get_node(n); print('ok', bkndb.__version__)"

  publish:
    # Only on a `python-vX.Y.Z` tag, after tests and every build succeeded.
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: [test, wheels, sdist, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing (no stored PyPI token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Tag must match the package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#python-v}"
          ls dist/*"-${tag}"[-.]* > /dev/null || { echo "no artifact for version $tag"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
