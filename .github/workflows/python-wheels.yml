name: Python wheels

on:
  push:
    tags: ["python-v*"]
  pull_request:
    paths:
      - "crates/bkndb-ffi/**"
      - "crates/bkndb-core/**"
      - "crates/bkndb/**"
      - "bindings/python/**"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            wheel_platform: win_amd64
          - os: ubuntu-latest
            wheel_platform: manylinux_2_17_x86_64
          - os: macos-13 # Intel
            wheel_platform: macosx_10_12_x86_64
          - os: macos-14 # Apple Silicon
            wheel_platform: macosx_11_0_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build native library + regenerate bindings
        run: python scripts/build_native.py
        working-directory: bindings/python

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
        working-directory: bindings/python

      - name: Smoke-test the built wheel in a clean venv
        shell: bash
        run: |
          python -m venv /tmp/wheel-check
          WHEEL=$(ls dist/*.whl)
          if [ "$RUNNER_OS" = "Windows" ]; then
            /tmp/wheel-check/Scripts/python -m pip install "$WHEEL"
            /tmp/wheel-check/Scripts/python -c "import bkndb; db = bkndb.in_memory(); db.create_node('Smoke', {}); print('ok')"
          else
            /tmp/wheel-check/bin/python -m pip install "$WHEEL"
            /tmp/wheel-check/bin/python -c "import bkndb; db = bkndb.in_memory(); db.create_node('Smoke', {}); print('ok')"
          fi
        working-directory: bindings/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.wheel_platform }}
          path: bindings/python/dist/*.whl

  publish:
    # Only runs on a `python-vX.Y.Z` tag push, after every platform builds
    # and smoke-tests cleanly — never on a pull request.
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing (no stored PyPI token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
