[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/bkndb-cli",
    "crates/bkndb-engine",
    "crates/bkndb-wasm",
    "crates/bkndb-core",
    "crates/bkndb-storage-redb",
    "crates/bkndb-storage-mem",
    "crates/bkndb-storage-lsm",
    "crates/bkndb",
    "crates/bkndb-ffi",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Bkn Org"]
repository = "https://github.com/BknOrg/bkndb"
description = "Embedded hybrid graph-relational database engine with ACID transactions"

[workspace.dependencies]
redb = "2"
crc32fast = "1"
tempfile = "3"

# Static archives distributed with the Go module. Keep the normal release profile unchanged.
[profile.go-dist]
inherits = "release"
debug = false
strip = "debuginfo"

[profile.wasm-dist]
inherits = "release"
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
