[workspace]
resolver = "2"
members = [
    "crates/bkndb-core",
    "crates/bkndb-storage-redb",
    "crates/bkndb-storage-mem",
    "crates/bkndb-storage-lsm",
    "crates/bkndb",
    "crates/bkndb-ffi",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Bkn Org"]
repository = "https://github.com/BknOrg/bkndb"
description = "Embedded hybrid graph-relational database engine with ACID transactions"

[workspace.dependencies]
redb = "2"
crc32fast = "1"
tempfile = "3"
