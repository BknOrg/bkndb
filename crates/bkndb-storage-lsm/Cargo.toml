[package]
name = "bkndb-storage-lsm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BknDb adapter for the independent LSM storage engine"
readme = "README.md"

[dependencies]
bkndb-core = { version = "0.3.1", path = "../bkndb-core" }
bkndb-engine = { path = "../bkndb-engine" }

[dev-dependencies]
bkndb-core = { path = "../bkndb-core", features = ["test-util", "graph", "relational", "search"] }
tempfile = { workspace = true }
