[package]
name = "bkndb-storage-lsm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native single-file LSM-tree storage engine with mmap zero-copy for BknDb"
readme = "README.md"

[dependencies]
bkndb-core = { version = "0.2.0", path = "../bkndb-core" }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
crc32fast = { workspace = true }
memmap2 = "0.9"
lz4_flex = "0.11"

[dev-dependencies]
bkndb-core = { path = "../bkndb-core", features = ["test-util", "graph", "relational", "search"] }
tempfile = { workspace = true }
