[package]
name = "bkndb-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Multi-platform Foreign Function Interface (FFI) bindings for BknDb"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
bkndb = { path = "../bkndb", features = ["redb-backend", "mem-backend", "graph", "relational-layer", "search"] }
bkndb-core = { path = "../bkndb-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.32.2", features = ["build", "cli"] }

[build-dependencies]
uniffi = { version = "0.32.2", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dev-dependencies]
tempfile = "3"
