[package]
name = "bkndb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Offline administration and query CLI for BknDb"
readme = "README.md"
publish = false

[[bin]]
name = "bkndb"
path = "src/main.rs"

[dependencies]
bkndb = { path = "../bkndb", features = ["lsm-backend"] }
bkndb-engine = { path = "../bkndb-engine" }
bkndb-storage-redb = { path = "../bkndb-storage-redb" }
bkndb-storage-lsm = { path = "../bkndb-storage-lsm" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = { workspace = true }
ctrlc = "3"
bincode = "1.3"
crossterm = "0.29"

[features]
fuzzing = []
test-failpoints = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"
